<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>peak</title>
</head>
<body>

    <h1>peak</h1>

    <!-- information dropdown -->
    <div style="position: absolute; top: 20px; right: 20px; z-index: 10;">
        <button id="openInfo" onclick="info('open')">Info</button>

        
        <div id="infoText" style="display: none; flex-direction: column; align-items: flex-end;">
            <div style="margin-bottom: 10px; width: 20vw; border-radius: 16px; border: 2px solid rgb(0,0,0); background: rgb(200, 200, 200); padding: 10px;">
                <p>Lock in.</p>
            </div>
            <button onclick="info('close')">Close</button>
        </div>
    </div>




    <!-- centering container -->
    <div style="display: flex; flex-direction: column; width: 90vw; align-items: center;">

        <!-- where user messages are stored -->
        <div id="history_panel" style="display: flex; flex-direction: column; width: 500px; height: 500px; overflow-y: auto"></div>

        <!-- user input field -->
        <form id="inputForm" style="margin-top: 10px;">

                <textarea id="userInput" placeholder="send a message" style="
                    outline: none; padding: 10px; width: 300px; min-height: 50px;
                    border-radius: 16px; background: rgb(220, 220, 220);
                    margin-right: -20px; margin-bottom: -30px; padding-right: 80px;
                    resize: none;"></textarea>

                <button id="enterButton" onclick="enterMessage()" style="
                    outline: none; width: 50px; height: 50px; margin-left: -44px;
                    padding: 10px; border-radius: 16px; font-size: 20px;
                    background: rgb(220, 220, 220);">↑</button>
        </form>
    </div>




    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        last_name_div = null;
        last_id = -1;
        frame = 0;

        window.onload = async () => {
            const get_data = await fetch("/get_data");
            const data = await get_data.json();
            if (data.length > 0) {
                data.forEach(msg => updateHistory(msg.id, msg.user, msg.message));
            }

            // handle enter key input
            document.getElementById("userInput").addEventListener("keydown", function(event){
                if (event.code === "Enter" && event.shiftKey) {
                    return;
                }
                else if (event.code === "Enter") {
                    event.preventDefault();
                    enterMessage();
                }
            });
        };

        async function update() {
            frame += 1;
            console.log(last_id)
            if ((frame % 100) == 0)
            {
                const get_data = await fetch("/get_data");
                const data = await get_data.json();
                if (data.length > 0) {
                    data.forEach(msg => updateHistory(msg.id, msg.user, msg.message));
                }
            }

            requestAnimationFrame(update);
        }

        requestAnimationFrame(update);

        function updateHistory(id, role, content) {
            const log = document.getElementById("history_panel");


            if (last_id >= id)
            {
                console.log("avoiding repeat")
                return;
            }
            
            console.log("continuing")

            //create div for storing user messages
            current_name = role == "user" ? "<b>You</b><br>" : "<b>Other</b><br>";

            if(last_name_div == null || last_name_div.innerHTML != current_name)
            {
                const name_div = document.createElement("div");
                name_div.className = role == "user" ? "name-user" : "name-other";
                name_div.innerHTML = current_name;

                last_name_div = name_div;
                log.appendChild(name_div);
            }

            const text_div = document.createElement("div");
            text_div.className = role == "user" ? "msg-user" : "msg-other";
            text_div.innerHTML = marked.parse(content);

            last_id = id;
            log.appendChild(text_div);
        }
        
        async function enterMessage() {
            const message = document.getElementById("userInput").value;
            const log = document.getElementById("history_panel");
            
            //prevent sending empty messages
            if (message === "") {
                return;
            }
            
            //clear input box
            document.getElementById("inputForm").reset();

            updateHistory(last_id+1, "user", message);

            log.scrollTo({
                top: log.scrollHeight,
                behavior: "smooth"
            });

            const sentMesage = await fetch("/main", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({message: message, user: "test"})
            });
        }
        
        function info(action) {
            const openButton = document.getElementById("openInfo");
            const infoText = document.getElementById("infoText");

            if (action == "open") {
                openButton.style.display = "none";
                infoText.style.display = "flex";
            }

            if (action == "close") {
                openButton.style.display = "";
                infoText.style.display = "none";
            }
        }
    </script>

    <style>
        .msg-user{
            margin-top: 5px;
            color: white;
            padding: 0.5px 10px;
            width: fit-content;
            border-radius: 20px;
            background: rgb(0, 68, 221);
            align-self: flex-end;
        }
        .msg-other{
            margin-top: 5px;
            padding: 0.5px 10px;
            width: fit-content;
            border-radius: 20px;
            background: rgb(220, 220, 220);
            align-self: flex-start;
        }
        
        
        /* for displaying user name, outside of text bubble */
        .name-user{
            margin-top: 10px;
            width: fit-content;
            align-self: flex-end;
        }
        .name-other{
            margin-top: 10px;
            width: fit-content;
            align-self: flex-start;
        }
    </style>
</body>
</html>
